name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Restore
        run: dotnet restore HonestFlow.Tests\HonestFlow.Tests.csproj

      - name: Build
        run: dotnet build HonestFlow.csproj -c Release --no-restore

      - name: Test
        run: dotnet test HonestFlow.Tests\HonestFlow.Tests.csproj -c Release --no-restore --verbosity normal
